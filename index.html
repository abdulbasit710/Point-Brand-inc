<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06060A" />
    <title>Point Brand Inc — Creative & Digital Studio, UK</title>
    <meta
      name="description"
      content="Point Brand is a UK creative studio crafting logos, websites, graphics, 2D/3D animation and social campaigns that make ambitious brands impossible to ignore."
    />
    <meta property="og:title" content="Point Brand Inc — Creative & Digital Studio" />
    <meta
      property="og:description"
      content="Logos, websites, graphics, 2D/3D animation and social marketing for brands that refuse to blend in."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.pointbrandinc.com" />

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('pb-theme') || 'dark';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(t);
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
